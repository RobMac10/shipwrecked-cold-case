<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cold Case Investigation · Shipwrecked on Ancient Ground</title>
<meta name="description" content="The reopened case file from Shipwrecked on Ancient Ground: three witness files, two classroom sources and six stages of work.">
<style>
:root{--paper:#f1e6cc;--ink:#231a10;--rule:#5b4a33;--red:#7a1f12;--box:#f2efe6}
*{box-sizing:border-box}
body{margin:0;background:#d9c9a3;color:var(--ink);font-family:Georgia,"Times New Roman",serif;line-height:1.5}
.sheet{max-width:1000px;margin:0 auto;background:var(--paper);padding:16px 14px 40px;min-height:100vh;box-shadow:0 0 30px rgba(0,0,0,.25)}
header{text-align:center;border-bottom:4px double var(--rule);padding-bottom:10px}
.mast{font-family:"Courier New",Courier,monospace;font-weight:bold;font-size:clamp(24px,7vw,46px);letter-spacing:2px;margin:4px 0;text-transform:uppercase}
.dateline{display:flex;justify-content:space-between;font-size:12px;text-transform:uppercase;letter-spacing:1px;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);padding:3px 0;margin-top:6px}
nav{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0;justify-content:center}
nav button,.btn{font:inherit;font-size:14px;padding:8px 10px;min-height:44px;background:var(--paper);color:var(--ink);border:1px solid var(--rule);cursor:pointer}
nav button[aria-current="true"]{background:var(--ink);color:var(--paper)}
.btn.dark{background:var(--ink);color:var(--paper)}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--red);outline-offset:2px}
h2{font-size:clamp(20px,5.5vw,30px);letter-spacing:2px;text-transform:uppercase;text-align:center;margin:14px 0 6px}
h3{font-size:19px;margin:18px 0 6px;border-bottom:1px solid var(--rule)}
.typed{font-family:"Courier New",Courier,monospace;background:var(--box);border:1.5px solid #444;padding:10px 12px;font-size:14.5px;white-space:pre-wrap;margin:10px 0;line-height:1.45}
.typed b{display:block}
.tag{font-family:"Courier New",Courier,monospace;font-weight:bold;font-size:14px;margin:14px 0 4px;color:var(--red)}
.check{background:#f7d98b;padding:0 3px;font-size:.85em;font-style:normal}
blockquote{margin:6px 0 8px;padding:8px 12px;border-left:3px solid var(--rule);font-style:italic;background:#efe2c4}
.label{display:inline-block;font-size:11px;letter-spacing:1px;text-transform:uppercase;border:1px solid var(--red);color:var(--red);padding:1px 6px;margin:4px 0}
.wtabs{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.grid{display:grid;gap:14px}
@media(min-width:900px){.grid.cols{grid-template-columns:1fr 1fr 1fr}}
.row{border:1px solid var(--rule);padding:10px;margin:8px 0;background:#f6edd8}
.row .q{font-weight:bold;margin-bottom:6px}
label{display:block;font-size:14px;margin:6px 0 2px}
input[type=text],textarea{width:100%;font:inherit;font-size:16px;padding:8px;border:1px solid var(--rule);background:#fffaf0;color:var(--ink)}
textarea{min-height:90px}
.ticks{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center}
.ticks label{display:inline-flex;align-items:center;gap:6px;margin:0;min-height:44px}
input[type=checkbox],input[type=radio]{width:22px;height:22px;accent-color:var(--red)}
.chips{display:flex;flex-direction:column;gap:6px;margin:6px 0}
.chips button{text-align:left}
.sure label{display:flex;gap:8px;align-items:center;min-height:44px}
.note{font-size:14px;border:1px dashed var(--rule);padding:8px 10px;margin:12px 0}
footer{margin-top:28px;border-top:4px double var(--rule);padding-top:10px;font-size:14px}
a{color:var(--red)}
[hidden]{display:none!important}
#print{display:none}
@media print{
 body{background:#fff}.sheet{box-shadow:none;max-width:none;padding:0}
 header,nav,main,footer,.noprint{display:none!important}
 #print{display:block;font-size:11pt;line-height:1.35}
 #print h1{font-family:"Courier New",monospace;font-size:16pt;margin:0 0 6px}
 #print h4{margin:8px 0 2px;font-size:11pt}
 #print p{margin:0 0 3px}
 @page{margin:12mm}
}
</style></head><body><div class="sheet">
<header>
<div class="mast">Cold Case</div>
<div style="font-style:italic;font-size:14px">A companion to <em>Shipwrecked on Ancient Ground</em></div>
<div class="dateline"><span>Mount Larcombe · Port Curtis</span><span>Christmas 1855</span></div>
</header>
<nav id="nav" aria-label="Sections"></nav>
<main id="main"></main>
<footer id="foot"></footer>
</div>
<div id="print"></div>
<script src="data.js"></script>
<script src="app.js"></script>
</body></html>
